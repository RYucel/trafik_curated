name: KKTC Traffic Intelligence — Autonomous Daily Shadow Pilot

on:
  schedule:
    # 03:00 UTC corresponds to 06:00 AM KKTC Cyprus Local Time (UTC+3)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date YYYY-MM-DD (Default: today)'
        required: false
        default: ''
      publish_approved:
        description: 'Publish the safety-approved Telegram bulletin for this manually dispatched run'
        required: false
        type: boolean
        default: false
      correction_republish:
        description: 'Republish a previously sent date only to correct its facts or public link'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram-daily-publication
  cancel-in-progress: false

jobs:
  run-shadow-pilot:
    name: Execute Daily Shadow Pilot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Execute Daily Shadow Production Pilot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.correction_republish == true) }}
        env:
          PILOT_TARGET_DATE: ${{ inputs.target_date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          TARGET_DATE="${PILOT_TARGET_DATE:-$(date +'%Y-%m-%d')}"
          node scripts/run_shadow_pilot.js "$TARGET_DATE"

      - name: Validate Daily Snapshot Artifacts
        env:
          PILOT_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          TARGET_DATE="${PILOT_TARGET_DATE:-$(date +'%Y-%m-%d')}"
          for artifact in ingestion.json verification.json statistics.json bulletin.md REVIEW_QUEUE.md errors.json; do
            if [ ! -f "data/pilot/$TARGET_DATE/$artifact" ]; then
              echo "❌ ERROR: Missing snapshot artifact: $artifact"
              exit 1
            fi
          done
          if [ ! -f "data/pilot/$TARGET_DATE/ingestion.json" ]; then
            echo "❌ ERROR: Daily shadow pilot failed to produce valid snapshot artifacts."
            exit 1
          fi
          echo "✓ Daily snapshot artifacts validated successfully."

      - name: Reserve approved Telegram bulletin (manual dispatch only)
        id: reserve_broadcast
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_approved == true }}
        env:
          PILOT_TARGET_DATE: ${{ inputs.target_date }}
          TELEGRAM_LIVE_ENABLED: 'true'
          PUBLIC_BULLETIN_BASE_URL: ${{ vars.PUBLIC_BULLETIN_BASE_URL }}
          ALLOW_CORRECTION_REPUBLISH: ${{ inputs.correction_republish }}
        run: |
          TARGET_DATE="${PILOT_TARGET_DATE:-$(date +'%Y-%m-%d')}"
          node scripts/prepare_approved_broadcast.js "$TARGET_DATE"

      - name: Commit and Push Snapshot & Publication Reservation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(pilot): automated daily shadow pilot snapshot [skip ci]"
          file_pattern: "db/kktc_traffic.db data/pilot/*"

      - name: Publish approved Telegram bulletin (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_approved == true }}
        env:
          PILOT_TARGET_DATE: ${{ inputs.target_date }}
          TELEGRAM_LIVE_ENABLED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_BULLETIN_BASE_URL: ${{ vars.PUBLIC_BULLETIN_BASE_URL }}
        run: |
          TARGET_DATE="${PILOT_TARGET_DATE:-$(date +'%Y-%m-%d')}"
          node scripts/run_approved_broadcast.js "$TARGET_DATE"

      - name: Commit successful Telegram publication state
        if: ${{ always() && steps.reserve_broadcast.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish_approved == true }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(live): record approved Telegram publication [skip ci]"
          file_pattern: "db/kktc_traffic.db"

      - name: Upload Daily Snapshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-pilot-snapshot-${{ github.run_id }}
          path: |
            data/pilot/
            db/kktc_traffic.db
          retention-days: 30
